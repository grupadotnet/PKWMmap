build:
  maxIssues: 0

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    active: false
  WildcardImport:
    active: false

complexity:
  LongMethod:
    threshold: 120
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 12
  CyclomaticComplexMethod:
    threshold: 25
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInObjects: 25

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'

Compose:
  ComposableAnnotationNaming:
    active: true
  ModifierMissing:
    active: true
  RememberMissing:
    active: true
  MutableStateAutoboxing:
    active: true
  ViewModelForwarding:
    active: true
