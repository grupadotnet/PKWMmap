name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  # Cancel stale PR runs, but let default-branch runs finish so they update the Gradle cache
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kmp-purity:
    name: KMP Purity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check commonMain & commonTest for JVM/Android-only APIs
        run: ./frontend/ci-test.sh purity

  gradle-checks:
    name: Static Analysis, Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ktlint & Detekt
        id: static
        continue-on-error: true
        run: ./frontend/ci-test.sh static

      - name: Run Android Lint
        id: lint
        continue-on-error: true
        run: ./frontend/ci-test.sh lint

      - name: Run Unit Tests
        id: test
        continue-on-error: true
        run: ./frontend/ci-test.sh test

      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-ci-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            frontend/composeApp/build/reports/detekt/
            frontend/composeApp/build/reports/ktlint/
            frontend/composeApp/build/reports/lint-results-*.html
            frontend/composeApp/build/reports/tests/
            frontend/composeApp/build/test-results/

      - name: Fail if any check failed
        if: |
          steps.static.outcome == 'failure' ||
          steps.lint.outcome == 'failure' ||
          steps.test.outcome == 'failure'
        run: |
          echo "::error::Gradle checks failed (static=${{ steps.static.outcome }}, lint=${{ steps.lint.outcome }}, test=${{ steps.test.outcome }})"
          exit 1
