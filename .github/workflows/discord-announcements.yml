name: Discord PR Threads

on:
  pull_request:
    types: [opened, ready_for_review, reopened, closed]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: read
  issues: write

concurrency:
  group: discord-pr-thread-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  notify-discord-pr:
    name: Post PR Update to Discord Thread
    runs-on: ubuntu-latest
    steps:
      - name: Sync PR event to Discord Forum thread
        env:
          DISCORD_PR_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AVATAR: ${{ github.event.pull_request.user.avatar_url }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_URL: ${{ github.event.review.html_url }}
          REVIEW_AUTHOR: ${{ github.event.review.user.login }}
          REVIEW_AVATAR: ${{ github.event.review.user.avatar_url }}
        run: |
          if [ -z "$DISCORD_PR_WEBHOOK_URL" ]; then
            echo "::error::Secret DISCORD_PR_WEBHOOK_URL is not set."
            exit 1
          fi

          python3 - <<'EOF'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          MOBILE_ROLE_ID = "1557494151061180556"
          BACKEND_ROLE_ID = "1574461892108226694"

          TAG_IDS = {
              "pull_request": "1574482634346864831",  # PR
              "frontend": "1574482861036273935",      # Mobile/Frontend
              "backend": "1574482809748324510",       # Backend
              "ci_infra": "1574484884678778944",      # CI/Infra
              "docs": "1574484919621525585",          # Docs
              "feature": "1574484954887356516",       # Feature
              "bugfix": "1574484980120162304",        # Bugfix
              "refactor": "1574485012064112641",      # Refactor
              "breaking": "1574485040924987614",      # Breaking
              "large_pr": "1574485133816234148",      # Large PR
          }

          LARGE_PR_THRESHOLD = 500

          WEBHOOK_URL = os.environ["DISCORD_PR_WEBHOOK_URL"]
          GITHUB_TOKEN = os.environ["GITHUB_TOKEN"]
          REPO = os.environ["REPO_NAME"]
          PR_NUM = os.environ["PR_NUMBER"]
          PR_TITLE = os.environ.get("PR_TITLE", "").strip()
          PR_BODY = os.environ.get("PR_BODY", "")
          PR_URL = os.environ.get("PR_URL", "")
          PR_DRAFT = os.environ.get("PR_DRAFT", "false").lower() == "true"
          PR_MERGED = os.environ.get("PR_MERGED", "false").lower() == "true"
          PR_BASE = os.environ.get("PR_BASE", "")
          PR_HEAD = os.environ.get("PR_HEAD", "")
          PR_AUTHOR = os.environ.get("PR_AUTHOR", "")
          PR_AVATAR = os.environ.get("PR_AVATAR", "")
          PR_LABELS = {
              str(lbl).strip().lower()
              for lbl in (json.loads(os.environ.get("PR_LABELS_JSON") or "[]") or [])
          }
          EVENT = os.environ["EVENT_NAME"]
          ACTION = os.environ.get("ACTION", "")

          THREAD_MARKER_RE = re.compile(r"<!--\s*discord-thread-id:(\d+)\s*-->")


          def truncate(text: str, limit: int) -> str:
              text = (text or "").strip()
              if len(text) <= limit:
                  return text
              return text[: limit - 3].rstrip() + "..."


          def with_query(url: str, params: dict) -> str:
              parsed = urllib.parse.urlsplit(url)
              query = urllib.parse.parse_qs(parsed.query)
              for key, value in params.items():
                  query[key] = [str(value)]
              return urllib.parse.urlunsplit(
                  (parsed.scheme, parsed.netloc, parsed.path, urllib.parse.urlencode(query, doseq=True), parsed.fragment)
              )


          def http_json(method: str, url: str, body: dict | None = None, headers: dict | None = None) -> dict | list:
              req_headers = {"User-Agent": "GitHub-Actions-Discord-PR-Notifier/1.0"}
              if headers:
                  req_headers.update(headers)
              data = None
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  req_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=req_headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  err_body = exc.read().decode("utf-8", errors="replace")
                  print(f"::error::HTTP {exc.code} for {method} {url}: {err_body}", file=sys.stderr)
                  sys.exit(1)


          def gh_headers() -> dict:
              return {
                  "Authorization": f"Bearer {GITHUB_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }


          def fetch_pr_files() -> list[dict]:
              files = []
              for page in range(1, 4):  # Up to 300 files
                  url = f"https://api.github.com/repos/{REPO}/pulls/{PR_NUM}/files?per_page=100&page={page}"
                  batch = http_json("GET", url, headers=gh_headers())
                  if not batch:
                      break
                  files.extend(batch)
                  if len(batch) < 100:
                      break
              return files


          def analyze_pr(files: list[dict]) -> dict:
              paths = [f.get("filename", "") for f in files]
              total_changes = sum(f.get("additions", 0) + f.get("deletions", 0) for f in files)

              title_lower = PR_TITLE.lower()
              body_lower = PR_BODY.lower()

              has_frontend = any(p.startswith(("frontend/", "mobile/")) for p in paths)
              has_backend = any(p.startswith(("backend/", "server/", "api/")) for p in paths)
              has_ci = any(
                  p.startswith((".github/", "infra/", "deploy/"))
                  or "dockerfile" in p.lower()
                  or "docker-compose" in p.lower()
                  for p in paths
              )
              has_docs = any(p.startswith("docs/") for p in paths) or (
                  bool(paths) and all(p.lower().endswith(".md") for p in paths)
              )

              is_breaking = (
                  bool(re.match(r"^[a-z]+(\([^)]+\))?!:", title_lower))
                  or "breaking change" in body_lower
                  or "breaking" in PR_LABELS
              )
              is_bugfix = bool(re.match(r"^fix(\([^)]+\))?!?:", title_lower)) or bool(
                  {"bug", "bugfix", "hotfix"} & PR_LABELS
              )
              is_feature = bool(re.match(r"^feat(\([^)]+\))?!?:", title_lower)) or bool(
                  {"feature", "enhancement"} & PR_LABELS
              )
              is_refactor = bool(re.match(r"^(refactor|chore|perf|style)(\([^)]+\))?!?:", title_lower)) or bool(
                  {"refactor", "chore", "tech-debt"} & PR_LABELS
              )
              is_large = total_changes >= LARGE_PR_THRESHOLD

              # Priority order; capped at Discord's 5-tag maximum
              candidates = ["pull_request"]
              if is_breaking:
                  candidates.append("breaking")
              if has_frontend:
                  candidates.append("frontend")
              if has_backend:
                  candidates.append("backend")
              if has_ci:
                  candidates.append("ci_infra")
              if has_docs:
                  candidates.append("docs")
              if is_bugfix:
                  candidates.append("bugfix")
              elif is_feature:
                  candidates.append("feature")
              elif is_refactor:
                  candidates.append("refactor")
              if is_large:
                  candidates.append("large_pr")

              tag_ids = [TAG_IDS[k] for k in candidates if TAG_IDS.get(k)][:5]

              # Smart role targeting: ping only relevant teams, or both for cross-cutting/root PRs
              roles_to_ping = []
              if has_frontend:
                  roles_to_ping.append(MOBILE_ROLE_ID)
              if has_backend:
                  roles_to_ping.append(BACKEND_ROLE_ID)
              if not roles_to_ping:
                  roles_to_ping = [MOBILE_ROLE_ID, BACKEND_ROLE_ID]

              return {
                  "tag_ids": tag_ids,
                  "roles_to_ping": roles_to_ping,
                  "total_changes": total_changes,
                  "file_count": len(files),
              }


          def find_thread_id() -> str | None:
              page = 1
              while True:
                  url = f"https://api.github.com/repos/{REPO}/issues/{PR_NUM}/comments?per_page=100&page={page}"
                  comments = http_json("GET", url, headers=gh_headers())
                  if not comments:
                      return None
                  for comment in comments:
                      match = THREAD_MARKER_RE.search(comment.get("body") or "")
                      if match:
                          return match.group(1)
                  if len(comments) < 100:
                      return None
                  page += 1


          def save_thread_id(thread_id: str) -> None:
              guild_id = None
              try:
                  webhook_info = http_json("GET", WEBHOOK_URL)
                  guild_id = webhook_info.get("guild_id")
              except SystemExit:
                  pass

              if guild_id:
                  link = f"https://discord.com/channels/{guild_id}/{thread_id}"
                  body = f"🧵 [Open Discord thread for this PR]({link})\n<!-- discord-thread-id:{thread_id} -->"
              else:
                  body = f"🧵 Linked to Discord thread `{thread_id}`.\n<!-- discord-thread-id:{thread_id} -->"

              url = f"https://api.github.com/repos/{REPO}/issues/{PR_NUM}/comments"
              http_json("POST", url, body={"body": body}, headers=gh_headers())


          # Build event-specific embed
          ping_roles = False
          author_name = PR_AUTHOR
          author_avatar = PR_AVATAR
          embed_url = PR_URL

          if EVENT == "pull_request":
              if ACTION == "opened":
                  if PR_DRAFT:
                      title = f"📝 Draft PR #{PR_NUM}: {PR_TITLE}"
                      color = 0x99AAB5
                  else:
                      title = f"🔀 PR #{PR_NUM} Opened: {PR_TITLE}"
                      color = 0x5865F2
                      ping_roles = True
                  description = truncate(PR_BODY, 3500) or "_No description provided._"
              elif ACTION == "ready_for_review":
                  title = f"👀 PR #{PR_NUM} Ready for Review"
                  color = 0x5865F2
                  description = f"**{PR_TITLE}** is ready for review (`{PR_HEAD}` → `{PR_BASE}`)."
                  ping_roles = True
              elif ACTION == "reopened":
                  title = f"🔄 PR #{PR_NUM} Reopened"
                  color = 0x5865F2
                  description = f"Reopened `{PR_HEAD}` → `{PR_BASE}`."
              elif ACTION == "closed":
                  if PR_MERGED:
                      title = f"🟣 PR #{PR_NUM} Merged"
                      color = 0x9B59B6
                      description = f"Merged `{PR_HEAD}` into `{PR_BASE}`."
                  else:
                      title = f"🔴 PR #{PR_NUM} Closed"
                      color = 0xED4245
                      description = "Closed without merging."
              else:
                  sys.exit(0)

          elif EVENT == "pull_request_review":
              state = os.environ.get("REVIEW_STATE", "").lower()
              review_body = os.environ.get("REVIEW_BODY", "").strip()
              author_name = os.environ.get("REVIEW_AUTHOR", "") or PR_AUTHOR
              author_avatar = os.environ.get("REVIEW_AVATAR", "")
              embed_url = os.environ.get("REVIEW_URL", "") or PR_URL

              if state == "approved":
                  title = f"✅ Approved by {author_name}"
                  color = 0x57F287
                  description = truncate(review_body, 3500) or "_Approved without comment._"
              elif state == "changes_requested":
                  title = f"🛠️ Changes Requested by {author_name}"
                  color = 0xED4245
                  description = truncate(review_body, 3500) or "_Changes requested._"
              elif state == "commented" and review_body:
                  title = f"💬 Review Comment by {author_name}"
                  color = 0x99AAB5
                  description = truncate(review_body, 3500)
              else:
                  sys.exit(0)
          else:
              sys.exit(0)

          thread_id = find_thread_id()

          # Only fetch PR files when creating a new thread or computing role pings
          analysis = analyze_pr(fetch_pr_files()) if (not thread_id or ping_roles) else None

          footer_text = f"{REPO} • PR #{PR_NUM} ({PR_HEAD} → {PR_BASE})"
          if analysis and not thread_id:
              footer_text += f" • {analysis['file_count']} files ({analysis['total_changes']} lines)"

          embed = {
              "title": truncate(title, 256),
              "url": embed_url,
              "description": description,
              "color": color,
              "footer": {"text": footer_text},
              "timestamp": datetime.now(timezone.utc).isoformat(),
          }
          if author_name:
              embed["author"] = {"name": author_name}
              if author_avatar:
                  embed["author"]["icon_url"] = author_avatar

          payload = {"embeds": [embed]}
          if ping_roles and analysis:
              roles = analysis["roles_to_ping"]
              payload["content"] = " ".join(f"<@&{r}>" for r in roles)
              payload["allowed_mentions"] = {"parse": [], "roles": roles}

          if thread_id:
              http_json("POST", with_query(WEBHOOK_URL, {"thread_id": thread_id}), body=payload)
          else:
              payload["thread_name"] = truncate(f"PR #{PR_NUM}: {PR_TITLE}", 100)
              if analysis and analysis["tag_ids"]:
                  payload["applied_tags"] = analysis["tag_ids"]
              response = http_json("POST", with_query(WEBHOOK_URL, {"wait": "true"}), body=payload)
              new_thread_id = response.get("channel_id")
              if not new_thread_id:
                  print(f"::error::Discord did not return channel_id: {response}", file=sys.stderr)
                  sys.exit(1)
              save_thread_id(new_thread_id)
          EOF
