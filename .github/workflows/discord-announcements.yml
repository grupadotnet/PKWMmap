name: Discord Announcements

on:
  discussion:
    types: [created]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      title:
        description: 'Announcement title (for manual test)'
        required: false
        default: 'Test Announcement'
      message:
        description: 'Announcement message (for manual test)'
        required: false
        default: 'This is a test announcement from GitHub Actions.'

permissions: {}

jobs:
  notify-discord:
    name: Send Announcement to Discord
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'discussion' && (
        github.event.discussion.category.slug == 'announcements' ||
        github.event.discussion.category.name == 'Announcements'
      ))
    steps:
      - name: Build and send Discord webhook payload
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          ACTOR: ${{ github.actor }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          DISCUSSION_AUTHOR: ${{ github.event.discussion.user.login }}
          DISCUSSION_AVATAR: ${{ github.event.discussion.user.avatar_url }}
          DISCUSSION_CREATED_AT: ${{ github.event.discussion.created_at }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
          RELEASE_AVATAR: ${{ github.event.release.author.avatar_url }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          MANUAL_TITLE: ${{ inputs.title }}
          MANUAL_MESSAGE: ${{ inputs.message }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Secret DISCORD_WEBHOOK_URL is not set. Add it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          python3 - <<'EOF' > payload.json
          import json
          import os
          from datetime import datetime, timezone

          MOBILE_ROLE_ID = "1557494151061180556"
          BACKEND_ROLE_ID = "1574461892108226694"

          def truncate(text: str, limit: int) -> str:
              text = (text or "").strip()
              if len(text) <= limit:
                  return text
              return text[: limit - 3].rstrip() + "..."

          event_name = os.environ.get("EVENT_NAME", "")
          repo_name = os.environ.get("REPO_NAME", "")
          repo_url = os.environ.get("REPO_URL", "")
          actor = os.environ.get("ACTOR", "")

          if event_name == "release":
              tag = os.environ.get("RELEASE_TAG", "").strip()
              name = os.environ.get("RELEASE_NAME", "").strip()
              is_pre = os.environ.get("RELEASE_PRERELEASE", "false").lower() == "true"
              label = "Pre-release" if is_pre else "Release"
              if name and tag and tag not in name:
                  raw_title = f"🚀 {label} {tag}: {name}"
              else:
                  raw_title = f"🚀 {label}: {name or tag or 'New Release'}"
              body = os.environ.get("RELEASE_BODY", "")
              url = os.environ.get("RELEASE_URL", "") or repo_url
              author = os.environ.get("RELEASE_AUTHOR", "") or actor
              avatar = os.environ.get("RELEASE_AVATAR", "")
              timestamp = os.environ.get("RELEASE_PUBLISHED_AT", "")
              color = 0xFEE75C if is_pre else 0x57F287
              footer_text = f"{repo_name} • {label}"
          elif event_name == "discussion":
              raw_title = f"📢 {os.environ.get('DISCUSSION_TITLE', '').strip() or 'New Announcement'}"
              body = os.environ.get("DISCUSSION_BODY", "")
              url = os.environ.get("DISCUSSION_URL", "") or repo_url
              author = os.environ.get("DISCUSSION_AUTHOR", "") or actor
              avatar = os.environ.get("DISCUSSION_AVATAR", "")
              timestamp = os.environ.get("DISCUSSION_CREATED_AT", "")
              color = 0x5865F2
              footer_text = f"{repo_name} • Discussion Announcement"
          else:
              raw_title = f"📢 {os.environ.get('MANUAL_TITLE', '').strip() or 'Announcement'}"
              body = os.environ.get("MANUAL_MESSAGE", "")
              url = repo_url
              author = actor
              avatar = ""
              timestamp = ""
              color = 0x5865F2
              footer_text = f"{repo_name} • Manual Announcement"

          if not timestamp:
              timestamp = datetime.now(timezone.utc).isoformat()

          embed = {
              "title": truncate(raw_title, 256),
              "url": url,
              "description": truncate(body, 4096) or "_No description provided._",
              "color": color,
              "footer": {"text": footer_text},
              "timestamp": timestamp,
          }

          if author:
              author_obj = {"name": author}
              if avatar:
                  author_obj["icon_url"] = avatar
              embed["author"] = author_obj

          payload = {
              "content": f"<@&{MOBILE_ROLE_ID}> <@&{BACKEND_ROLE_ID}>",
              "allowed_mentions": {
                  "parse": [],
                  "roles": [MOBILE_ROLE_ID, BACKEND_ROLE_ID],
              },
              "embeds": [embed],
          }

          print(json.dumps(payload))
          EOF

          curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$DISCORD_WEBHOOK_URL"
